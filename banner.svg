<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D9FF42" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF4C1F" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D9FF42" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="220" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="220" rx="16" stroke="url(#waveGrad1)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Animated Wave 1 -->
  <path d="M0 130 C 300 170, 600 100, 900 150 C 1050 175, 1150 140, 1200 145 L 1200 220 L 0 220 Z" fill="url(#waveGrad2)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M0 130 C 300 170, 600 100, 900 150 C 1050 175, 1150 140, 1200 145 L 1200 220 L 0 220 Z;
              M0 145 C 300 110, 600 165, 900 120 C 1050 105, 1150 160, 1200 135 L 1200 220 L 0 220 Z;
              M0 130 C 300 170, 600 100, 900 150 C 1050 175, 1150 140, 1200 145 L 1200 220 L 0 220 Z" />
  </path>

  <!-- Animated Wave 2 (Foreground crisp) -->
  <path d="M0 160 C 250 125, 550 190, 850 145 C 1020 120, 1120 170, 1200 155 L 1200 220 L 0 220 Z" fill="url(#waveGrad1)" opacity="0.6">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 160 C 250 125, 550 190, 850 145 C 1020 120, 1120 170, 1200 155 L 1200 220 L 0 220 Z;
              M0 140 C 250 180, 550 130, 850 170 C 1020 190, 1120 140, 1200 165 L 1200 220 L 0 220 Z;
              M0 160 C 250 125, 550 190, 850 145 C 1020 120, 1120 170, 1200 155 L 1200 220 L 0 220 Z" />
  </path>

  <!-- Cyber grid accent dots -->
  <g opacity="0.15" fill="#00F5FF">
    <circle cx="50" cy="40" r="2" /><circle cx="80" cy="40" r="2" /><circle cx="110" cy="40" r="2" />
    <circle cx="50" cy="70" r="2" /><circle cx="80" cy="70" r="2" /><circle cx="110" cy="70" r="2" />
    <circle cx="1090" cy="40" r="2" /><circle cx="1120" cy="40" r="2" /><circle cx="1150" cy="40" r="2" />
    <circle cx="1090" cy="70" r="2" /><circle cx="1120" cy="70" r="2" /><circle cx="1150" cy="70" r="2" />
  </g>

  <!-- Main Name Title -->
  <text x="50%" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)" filter="url(#glow)">
    Swastika Mondal
  </text>

  <!-- Subtitle -->
  <text x="50%" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="19" font-weight="600" letter-spacing="0.5" fill="#E2E8F0">
    Associate Software Engineer @ Cognizant  |  SAP PI/PO &amp; ABAP Developer
  </text>
</svg>
